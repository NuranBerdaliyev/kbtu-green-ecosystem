spring:
  application:
    name: kbtu-green-ecosystem
    profiles:
      active: dev # Настройка профилей
    datasource:
      url: JDBC:postgresql://localhost:5432/kbtu_green_ecosystem
      username: green_user
      password: green_password
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
